[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zhixing-agent-server"
version = "0.4.2"
description = "Enterprise agent application server"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.2",
  "cryptography==50.0.2",
  "python-multipart==0.0.32",
  "httpx==0.28.1",
  "mcp==1.30.0",
  "jsonschema==4.26.0",
  "referencing==0.37.0",
  "claude-agent-sdk==0.2.178",
  "pypdf==6.21.4",
  "pypdfium2==5.14.0",
  "rapidocr-onnxruntime==1.4.4",
  "fastembed==0.9.1",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
zhixing-server = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "harness*"]

[tool.setuptools.package-data]
harness = ["*.ts", "package.json", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
