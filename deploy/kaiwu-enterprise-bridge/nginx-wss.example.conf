# Public HTTPS/WSS reverse proxy example. The frps bindPort remains private.
# The Windows connector and cloud visitor must both use
# transport.protocol = "wss". Setting protocol = "websocket" together with
# transport.tls.enable = true does not make official frpc use TLS.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream kaiwu_edge_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Dedicated relay endpoint used by the customer Windows frpc.
server {
    listen 443 ssl http2;
    server_name relay.example.com;

    ssl_certificate     /etc/letsencrypt/live/relay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;

    location /~!frp {
        proxy_pass http://127.0.0.1:37443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

# Existing Kaiwu HTTPS host. Preserve the public MCP mount path and forward it
# to the single Edge worker; location and proxy_pass intentionally omit a URI
# suffix so the incoming /projects/kaiwu/mcp/... path is preserved.
server {
    listen 443 ssl http2;
    server_name flintw.com;

    ssl_certificate     /etc/letsencrypt/live/flintw.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flintw.com/privkey.pem;

    location /projects/kaiwu/mcp/ {
        proxy_pass http://kaiwu_edge_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 2m;
    }
}
